version: '3.8'

services:
  app:
    build: .
    container_name: tableau-analysis-api
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL}
      - TABLEAU_API_URL=${TABLEAU_API_URL}
      - TABLEAU_USERNAME=${TABLEAU_USERNAME}
      - TABLEAU_PASSWORD=${TABLEAU_PASSWORD}
      - DEBUG=${DEBUG}
    volumes:
      - ./app:/app/app
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
